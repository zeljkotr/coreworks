<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CoreWorks{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin:0; background:#101722; color:#edf2f7; }
    header { padding:1rem 5vw; background:#182435; display:flex;
             align-items:center; justify-content:space-between; gap:1rem; }
    main { max-width:960px; margin:3rem auto; padding:0 1.2rem; }
    a { color:#83c5ff; }
    .brand { font-weight:750; font-size:1.25rem; color:white; text-decoration:none; }
    .muted { color:#b5c1d0; }
    .card { background:#1a2738; border:1px solid #34445a; border-radius:12px;
            padding:1.25rem; margin:1rem 0; }
    input, button { font:inherit; padding:.75rem; border-radius:7px; }
    input { width:100%; box-sizing:border-box; margin:.35rem 0 1rem;
             background:#101722; color:white; border:1px solid #53657c; }
    button { cursor:pointer; background:#2f80ed; color:white; border:0; }
    .secondary { background:#35465d; }
    .flash { padding:.8rem; border-radius:8px; background:#263c52; margin:1rem 0; }
    .error { background:#542b35; }
    .success { background:#234b3a; }
    nav { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.7rem; border-bottom:1px solid #34445a; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
    form.inline { display:inline; }
  </style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('dashboard') if current_username else url_for('login') }}">CoreWorks</a>
  {% if current_username %}
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('monitor_status') }}">Monitor</a>
    {% if current_role == 'admin' %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
    <span class="muted">{{ current_username }}</span>
    <form class="inline" method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="secondary" type="submit">Odjava</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
